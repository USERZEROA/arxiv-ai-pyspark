name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pip install pyspark==4.3.0 pyarrow==26.0.1 pandas==2.3.3 pytest
      - name: Compile scripts
        run: python -m py_compile pipeline.py spark_session.py download_data.py build_categories.py make_charts.py
      - name: Unit tests (small hand-made test data, local Spark)
        run: python -m pytest -q tests
